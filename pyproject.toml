[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goatlab"
version = "0.1.0"
description = "Auditable NBA historical analytics foundation for modeling definitions of all-time greatness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GOAT Lab contributors" }]
dependencies = [
  "duckdb>=1.5.4,<2",
  "nba-api==1.11.4",
  "nbadb @ git+https://github.com/wyattowalsh/nbadb.git@48abd9825ed6933b57dbac3f50f058523367b1f5",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goatlab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["goatlab"]
