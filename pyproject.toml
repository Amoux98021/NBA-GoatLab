[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "goatlab"
version = "0.1.0"
description = "Auditable NBA historical analytics foundation for modeling definitions of all-time greatness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GOAT Lab contributors" }]
dependencies = [
  "duckdb>=1.5.4,<2",
  "nba-api==1.11.4",
  "nbadb @ git+https://github.com/wyattowalsh/nbadb.git@48abd9825ed6933b57dbac3f50f058523367b1f5",
  "pydantic>=2.11,<3",
  "pyarrow>=25,<26",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = ["network: opt-in tests that call live external services"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["goatlab"]
