name: repository-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: >-
          mypy --disable-error-code=redundant-cast
          src/goatlab/product/api.py
          src/goatlab/product/deployment.py
          src/goatlab/product/postgres_repository.py
          src/goatlab/product/settings.py
          pipelines/product/package_ranking_release.py
          pipelines/product/materialize_deployment_release.py
          pipelines/product/smoke_production.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      GOATLAB_RELEASE_ID: goatlab-ranking-release-2026-v2-probabilistic
      GOATLAB_PUBLICATION_RIGHTS_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.api --tag goatlab-api:ci .
