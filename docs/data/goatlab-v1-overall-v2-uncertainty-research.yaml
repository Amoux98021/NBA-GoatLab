  - OFFICIAL_OVERALL_POINT
  - PROVISIONAL_OVERALL_POINT
  - OVERALL_INTERVAL_ONLY
  - OVERALL_UNAVAILABLE
prohibitions:
  weight_renormalization: true
  interval_midpoint_as_exact: true
  confidence_penalty: true
  missing_accolades_as_zero: true
  player_specific_logic: true
active_career_policy: TO_DATE_NO_PROJECTION
defense_caveat: DEFENSE_V1_FROZEN_PENDING_REVISION
