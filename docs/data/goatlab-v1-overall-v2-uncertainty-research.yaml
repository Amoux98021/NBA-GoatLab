  longevity: goatlab-v1-longevity-v2-tiered
weights:
  peak: 0.17
  longevity: 0.14
  offense: 0.16
  defense: 0.14
  playoffs: 0.18
  accolades: 0.10
  winning: 0.11
uncertainty:
  modeled_dimensions: [peak, longevity]
  pairing: same_u3_stratified_block_career_draw
  draws: 2500
  central_estimator: median_of_paired_overall_draws
